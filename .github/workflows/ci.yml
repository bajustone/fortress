name: CI
on:
  push:
  pull_request:
  schedule:
    # Nightly full run — exercises the heavier PostgreSQL/testcontainers matrix
    # even on quiet days so dialect drift is caught before a release.
    - cron: '0 6 * * *'

concurrency:
  # Normalize push and same-repository PR runs onto the same head branch key,
  # while keeping fork branches with identical names isolated by repository.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  # Superseded branch and PR runs are cancelled. `main` and release tags are
  # not: those runs gate releases and must finish even when several commits or
  # tags land together.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check:version
      - run: bun run lint
      - run: bun run check:docs
      - run: bun run typecheck
      - run: bun run typecheck:examples
      - run: bun run typecheck:scripts
      - name: Generated migration artifact parity
        run: bun run check:migration-artifacts
      - name: Exports parity (jsr.json ⇄ package.json ⇄ tsup)
        run: bun run check:exports
      - name: Source and built-package consumer contract
        run: bun run check:consumer-contract
      - name: TypeScript-branch publication policy
        run: bun run check:repository-publication-policy
      - name: Packed npm publication manifest and CLI
        run: bun run check:package-cli

  # Fail-on-increase ratchet for the staged `noUncheckedIndexedAccess` adoption
  # (issue #28). Production and test diagnostic counts are compared to separate
  # checked-in baselines, so a cleanup in either bucket cannot mask a regression
  # in the other. This job also fails when the compiler, measurement, parser, or
  # baseline is invalid; do not add `continue-on-error`. Reductions pass and are
  # locked in by deliberately lowering the corresponding checked-in baseline.
  strictness-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: noUncheckedIndexedAccess diagnostic ratchet
        run: bun run check:strict-indexed

  # Unit suite (SQLite test adapter) across every supported runtime. Bun is the
  # primary runtime; the Node jobs run the same vitest suite under Node's
  # better-sqlite3 path so the Node-compatible build stays honest.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node20, node22, node24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # `.nvmrc` is the single source of truth for the documented minimum, so
      # this job exercises the exact floor declared in `engines.node` rather
      # than whatever the latest 20.x happens to be.
      - if: matrix.runtime == 'node20'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: matrix.runtime == 'node22'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.runtime == 'node24'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Test (bun)
        if: matrix.runtime == 'bun'
        run: bun run test
      - name: Test (node)
        if: matrix.runtime != 'bun'
        # vitest's shebang runs it under the Node selected above.
        run: ./node_modules/.bin/vitest run

  # PostgreSQL integration suite via testcontainers. Covers the pg dialect, the
  # tenancy connection-pinning/search_path isolation, and the framework
  # adapters end-to-end. This is release-critical and therefore runs on every
  # push, pull request, and nightly schedule accepted by this workflow.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  jsr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: deno --version
      - run: bun run check:jsr
