name: Publish
on:
  push:
    tags: ['v*']

jobs:
  # Gate the release on the committed package.json/jsr.json being in sync. The
  # publish-jsr job re-syncs jsr.json before publishing, which would otherwise
  # silently mask drift in the committed source; this job surfaces it so a
  # tagged release fails loudly instead. Mirrors the local pre-push hook.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check:version

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: deno --version
      - run: bun run check:jsr
      - run: bun run check:exports
      - run: bun run check:migration-artifacts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:examples
      - run: bun run test
      - run: bun run test:integration
      - run: bun run check:consumer-contract
      - run: bun run check:testing-esm
      - run: bun run check:package-cli

  publish-jsr:
    needs: [verify-version, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Sync version from package.json to jsr.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v' jsr.json > jsr.tmp && mv jsr.tmp jsr.json
      - run: npx jsr publish --allow-dirty

  publish-npm:
    needs: [verify-version, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsup
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@latest
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@bajustone/fortress@$VERSION" version >/dev/null 2>&1; then
            echo "@bajustone/fortress@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish --access public
